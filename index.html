<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NicheTrack — Finanz-Tracker für Freelancer, Creator und Solopreneure mit unregelmäßigem Einkommen." />
    <meta name="theme-color" content="#147df5" />
    <title>NicheTrack — Finanz-Tracker</title>
    <script>
      // Applied before first paint to avoid a light/dark flash on load.
      try {
        var stored = JSON.parse(localStorage.getItem('nichetrack-theme') || 'null')
        var theme = stored?.state?.theme || 'system'
        var resolved = theme === 'system'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : theme
        document.documentElement.setAttribute('data-theme', resolved)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
